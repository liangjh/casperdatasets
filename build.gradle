plugins {
    id 'java'
    id 'maven-publish'
}

group = 'net.casper'
version = project.findProperty('version') ?: '3.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'CasperDatasets',
            'Implementation-Version': project.version
        )
    }
}

tasks.named('javadoc') {
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'CasperDatasets'
                description = 'A lightweight, zero-dependency in-memory dataset framework for Java'
                url = 'https://github.com/liangjh/casperdatasets'
                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
            }
        }
    }
}
