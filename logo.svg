<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="ghostBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dceaf5;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#c5d9eb;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#a8c4d9;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <!-- Ghost made of data rows - the ghost body is formed by stacked horizontal bars -->
  <!-- Top of head -->
  <rect x="110" y="30" width="60" height="8" rx="4" fill="#c5d9eb" opacity="0.5"/>
  <rect x="95" y="42" width="90" height="8" rx="4" fill="#c5d9eb" opacity="0.55"/>
  <rect x="85" y="54" width="110" height="8" rx="4" fill="#c5d9eb" opacity="0.6"/>
  <rect x="80" y="66" width="120" height="8" rx="4" fill="#c5d9eb" opacity="0.65"/>
  <!-- Eye row -->
  <rect x="78" y="78" width="20" height="8" rx="4" fill="#c5d9eb" opacity="0.7"/>
  <circle cx="108" cy="82" r="6" fill="#3d5a73"/>
  <circle cx="106" cy="80" r="2" fill="white" opacity="0.7"/>
  <rect x="118" y="78" width="24" height="8" rx="4" fill="#c5d9eb" opacity="0.7"/>
  <circle cx="152" cy="82" r="6" fill="#3d5a73"/>
  <circle cx="150" cy="80" r="2" fill="white" opacity="0.7"/>
  <rect x="162" y="78" width="38" height="8" rx="4" fill="#c5d9eb" opacity="0.7"/>
  <!-- Body rows -->
  <rect x="78" y="90" width="124" height="8" rx="4" fill="#c5d9eb" opacity="0.65"/>
  <!-- Smile row -->
  <rect x="78" y="102" width="30" height="8" rx="4" fill="#c5d9eb" opacity="0.6"/>
  <path d="M115 106 Q130 115 145 106" fill="none" stroke="#3d5a73" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <rect x="150" y="102" width="50" height="8" rx="4" fill="#c5d9eb" opacity="0.6"/>
  <!-- Lower body -->
  <rect x="80" y="114" width="120" height="8" rx="4" fill="#c5d9eb" opacity="0.5"/>
  <rect x="82" y="126" width="116" height="8" rx="4" fill="#c5d9eb" opacity="0.4"/>
  <!-- Wavy bottom - dissolving into data -->
  <rect x="80" y="138" width="18" height="6" rx="3" fill="#c5d9eb" opacity="0.3"/>
  <rect x="104" y="138" width="22" height="6" rx="3" fill="#c5d9eb" opacity="0.28"/>
  <rect x="132" y="138" width="18" height="6" rx="3" fill="#c5d9eb" opacity="0.25"/>
  <rect x="156" y="138" width="22" height="6" rx="3" fill="#c5d9eb" opacity="0.22"/>
  <rect x="184" y="138" width="14" height="6" rx="3" fill="#c5d9eb" opacity="0.18"/>
  <!-- Dissolving particles -->
  <rect x="85" y="150" width="10" height="4" rx="2" fill="#c5d9eb" opacity="0.15"/>
  <rect x="115" y="148" width="14" height="4" rx="2" fill="#c5d9eb" opacity="0.12"/>
  <rect x="145" y="150" width="8" height="4" rx="2" fill="#c5d9eb" opacity="0.1"/>
  <rect x="170" y="148" width="12" height="4" rx="2" fill="#c5d9eb" opacity="0.08"/>
  <!-- Text -->
  <text x="220" y="88" font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#2c3e50" letter-spacing="1">casper</text>
  <text x="220" y="118" font-family="'Courier New', monospace" font-size="26" font-weight="400" fill="#6a8da6" letter-spacing="1">datasets</text>
</svg>
